<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 退订页不该被搜索引擎收录 -->
  <meta name="robots" content="noindex,nofollow">
  <!-- URL 里带着退订令牌，不往任何地方带 Referer -->
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>评论通知退订 · 闪界</title>
  <style>
    :root {
      --bg: hsl(212 16% 98%);
      --card: #ffffff;
      --text: hsl(0 0% 20%);
      --muted: hsl(0 0% 45%);
      --border: rgba(0, 0, 0, .08);
      --accent: hsl(158 60% 40%);   /* 站点强调色 #29A376 */
      --tone: var(--accent);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: hsl(212 12% 12%);
        --card: hsl(212 10% 16%);
        --text: hsl(0 0% 88%);
        --muted: hsl(0 0% 62%);
        --border: rgba(255, 255, 255, .1);
      }
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                   "Microsoft YaHei", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 32px 28px 26px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .06);
      text-align: center;
      transition: opacity .18s ease;
    }

    /* 图标：默认中性，状态变化时改色调 */
    .mark {
      width: 46px;
      height: 46px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      color: var(--tone);
      background: color-mix(in srgb, var(--tone) 12%, transparent);
    }

    .mark svg { width: 22px; height: 22px; }

    /* 各状态的图标切换 */
    .mark .i-ok, .mark .i-bad { display: none; }
    .card[data-tone="ok"] .mark .i-mail,
    .card[data-tone="bad"] .mark .i-mail { display: none; }
    .card[data-tone="ok"] .mark .i-ok { display: block; }
    .card[data-tone="bad"] .mark .i-bad { display: block; }
    .card[data-tone="ok"] { --tone: hsl(158 60% 40%); }
    .card[data-tone="bad"] { --tone: hsl(0 55% 55%); }
    .card[data-tone="idle"] { --tone: var(--muted); }

    h1 {
      margin: 0 0 8px;
      font-size: 19px;
      font-weight: 600;
      letter-spacing: .01em;
    }

    p { margin: 0; }

    .desc { color: var(--muted); }

    /* 邮箱（后端已脱敏） */
    .mail {
      display: inline-block;
      margin: 14px 0 0;
      padding: 5px 12px;
      max-width: 100%;
      overflow-wrap: anywhere;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      color: var(--text);
      background: color-mix(in srgb, var(--text) 4%, transparent);
    }

    button {
      margin-top: 22px;
      padding: 11px 26px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 500;
      cursor: pointer;
      transition: filter .15s ease, opacity .15s ease;
    }

    button:hover:not(:disabled) { filter: brightness(1.08); }
    button:disabled { opacity: .55; cursor: default; }

    .hint {
      margin-top: 14px;
      color: var(--muted);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .hint:empty { display: none; }

    .brand {
      margin-top: 26px;
      font-size: 12px;
      color: var(--muted);
      opacity: .7;
    }

    .brand a { color: inherit; text-decoration: none; }
    .brand a:hover { text-decoration: underline; }

    @media (prefers-reduced-motion: reduce) {
      .card, button { transition: none; }
    }
  </style>
  <link rel="canonical" href="https://flashj.cn/unsubscribe.html">
</head>
<body>
  <main class="card" id="card" data-tone="idle" aria-live="polite">
    <div class="mark" aria-hidden="true">
      <!-- 信封：校验中 / 待确认 -->
      <svg class="i-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="14" rx="2"></rect>
        <path d="M3.5 7l8.5 6 8.5-6"></path>
      </svg>
      <!-- 对勾：已退订 / 已退订过 -->
      <svg class="i-ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6L9 17l-5-5"></path>
      </svg>
      <!-- 感叹号：链接无效 / 网络异常 -->
      <svg class="i-bad" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M12 7.5v5.5"></path>
        <path d="M12 16.6h.01"></path>
      </svg>
    </div>

    <h1 id="title">评论通知退订</h1>
    <p class="desc" id="desc">正在校验退订链接…</p>
    <p><span class="mail" id="mail" hidden></span></p>
    <button id="action" type="button" hidden>确认退订</button>
    <p class="hint" id="hint"></p>

    <p class="brand"><a href="https://flashj.cn/">闪 界 · flashj.cn</a></p>
  </main>

  <script>
  (function () {
    'use strict';

    var API = 'https://mousebomb.org/api/comments/unsubscribe';

    // 语言：浏览器语言以 en 开头走英文，其余一律中文
    var LANG = /^en/i.test(navigator.language || navigator.userLanguage || '') ? 'en' : 'zh';

    var TEXT = {
      zh: {
        title: '评论通知退订',
        loading: '正在校验退订链接…',
        confirmTitle: '确认退订',
        confirmDesc: '确认不再接收 {email} 的评论通知？',
        confirmDescNoMail: '确认不再接收评论通知？',
        confirmBtn: '确认退订',
        working: '处理中…',
        doneTitle: '已退订',
        doneDesc: '退订成功，这个邮箱不会再收到评论通知了。',
        alreadyTitle: '已经退订过了',
        alreadyDesc: '这个邮箱已经退订过了，不会再收到评论通知。',
        invalidTitle: '链接无效或已过期',
        invalidDesc: '请回到邮件里点开最新的退订链接，或回复任意一封评论通知邮件联系站长人工处理。',
        retryTitle: '网络异常',
        retryDesc: '校验退订链接失败，请稍后重试。',
        retryBtn: '重试',
        tokenErr: '退订链接无效或已过期',
        postFail: '退订失败，请稍后重试。'
      },
      en: {
        title: 'Unsubscribe from comment notifications',
        loading: 'Validating your unsubscribe link…',
        confirmTitle: 'Confirm unsubscribe',
        confirmDesc: 'Stop receiving comment notifications at {email}?',
        confirmDescNoMail: 'Stop receiving comment notification emails?',
        confirmBtn: 'Confirm',
        working: 'Working…',
        doneTitle: 'Unsubscribed',
        doneDesc: 'Done. This address will no longer receive comment notifications.',
        alreadyTitle: 'Already unsubscribed',
        alreadyDesc: 'This address has already been unsubscribed and will not receive comment notifications.',
        invalidTitle: 'Invalid or expired link',
        invalidDesc: 'Open the most recent unsubscribe link from your email, or reply to any comment notification email to reach the site owner.',
        retryTitle: 'Something went wrong',
        retryDesc: 'Could not validate the unsubscribe link. Please try again in a moment.',
        retryBtn: 'Retry',
        tokenErr: 'This unsubscribe link is invalid or has expired.',
        postFail: 'Unsubscribe failed. Please try again later.'
      }
    };

    var T = TEXT[LANG];
    document.documentElement.lang = LANG === 'en' ? 'en' : 'zh-CN';
    document.title = T.title + (LANG === 'en' ? ' · flashj.cn' : ' · 闪界');

    var card = document.getElementById('card');
    var elTitle = document.getElementById('title');
    var elDesc = document.getElementById('desc');
    var elMail = document.getElementById('mail');
    var elAction = document.getElementById('action');
    var elHint = document.getElementById('hint');

    // 当前状态，用于 POST 结束后决定是否还原按钮文案
    var state = 'loading';
    var busy = false;

    /**
     * 统一渲染一个状态
     * @param {string} name  状态名
     * @param {object} view  { title, desc, tone, mail, action, hint }
     */
    function render(name, view) {
      state = name;
      card.setAttribute('data-tone', view.tone || 'idle');

      elTitle.textContent = view.title;
      elDesc.textContent = view.desc;

      if (view.mail) {
        elMail.textContent = view.mail;
        elMail.hidden = false;
      } else {
        elMail.textContent = '';
        elMail.hidden = true;
      }

      if (view.action) {
        elAction.textContent = view.action.label;
        elAction.hidden = false;
        elAction.disabled = false;
        elAction.onclick = view.action.onClick;
      } else {
        elAction.hidden = true;
        elAction.onclick = null;
      }

      elHint.textContent = view.hint || '';
    }

    function showLoading() {
      render('loading', { title: T.title, desc: T.loading, tone: 'idle' });
    }

    function showInvalid() {
      render('invalid', { title: T.invalidTitle, desc: T.invalidDesc, tone: 'bad' });
    }

    function showRetry() {
      render('retry', {
        title: T.retryTitle,
        desc: T.retryDesc,
        tone: 'bad',
        action: { label: T.retryBtn, onClick: verify }
      });
    }

    function showConfirm(mail) {
      render('confirm', {
        title: T.confirmTitle,
        desc: mail ? T.confirmDesc.replace('{email}', mail) : T.confirmDescNoMail,
        tone: 'idle',
        action: { label: T.confirmBtn, onClick: confirmUnsubscribe }
      });
    }

    function showDone() {
      render('done', { title: T.doneTitle, desc: T.doneDesc, tone: 'ok' });
    }

    function showAlready(mail) {
      render('already', { title: T.alreadyTitle, desc: T.alreadyDesc, tone: 'ok', mail: mail });
    }

    /** 只读校验：GET，幂等，不会真的退订 */
    function verify() {
      showLoading();

      var query = new URLSearchParams({ e: email, t: token });

      fetch(API + '?' + query.toString(), { headers: { Accept: 'application/json' } })
        .then(function (res) {
          // 5xx 当网络异常处理，4xx 当链接无效
          if (!res.ok) {
            if (res.status >= 500) throw new Error('server');
            return { valid: false };
          }
          return res.json();
        })
        .then(function (data) {
          if (!data || data.valid !== true) return showInvalid();
          if (data.unsubscribed === true) return showAlready(data.email || '');
          showConfirm(data.email || '');
        })
        .catch(function () {
          showRetry();
        });
    }

    /** 确认退订：POST，幂等 */
    function confirmUnsubscribe() {
      if (busy) return;
      busy = true;
      elAction.disabled = true;
      elAction.textContent = T.working;
      elHint.textContent = '';

      fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({ e: email, t: token })
      })
        .then(function (res) {
          return res.json().catch(function () { return null; }).then(function (data) {
            return { ok: res.ok, data: data };
          });
        })
        .then(function (r) {
          if (r.ok) return showDone();

          // 令牌类的错误按当前语言显示，其它（后端）文案原样透出
          if (r.data && r.data.code === 'COMMENT_UNSUB_TOKEN_ERR') {
            elHint.textContent = T.tokenErr;
          } else {
            elHint.textContent = (r.data && r.data.message) || T.postFail;
          }
          elAction.disabled = false;
          elAction.textContent = T.confirmBtn;
        })
        .catch(function () {
          elHint.textContent = T.postFail;
          elAction.disabled = false;
          elAction.textContent = T.confirmBtn;
        })
        .then(function () {
          busy = false;
        });
    }

    // 令牌来自邮件里的退订链接；缺任一参数直接判为无效链接
    var params = new URLSearchParams(location.search);
    var email = params.get('e');
    var token = params.get('t');

    if (!email || !token) {
      showInvalid();
    } else {
      verify();
    }
  })();
  </script>
</body>
</html>
